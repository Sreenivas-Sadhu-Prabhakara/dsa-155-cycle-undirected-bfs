<svg xmlns="http://www.w3.org/2000/svg" width="760" height="699.0" viewBox="0 0 760 699.0" role="img" aria-label="Step-by-step visual walkthrough">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="context-stroke"/></marker></defs>
<rect x="1.0" y="1.0" width="758.0" height="697.0" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="24.0" y="34.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#1e293b" text-anchor="start" font-weight="600">Undirected Cycle (BFS) — an old friend who isn't your parent</text>
<circle cx="35.0" cy="74.0" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
<text x="35.0" y="78.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">1</text>
<text x="56.0" y="79.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Does a cycle exist? Component 2-3-4 forms a triangle — yes. In an undirected graph,</text>
<text x="56.0" y="98.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">the edge you ARRIVED through always shows the parent again; that's not a cycle.</text>
<line x1="158.8" y1="173.0" x2="158.8" y2="221.0" stroke="#94a3b8" stroke-width="1.6"/>
