<text x="201.0" y="644.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">0-1 component → no cycle</text>
<rect x="328.0" y="625.0" width="234.0" height="28.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="445.0" y="644.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">2-3-4 triangle → cycle ✓</text>
