<circle cx="35.0" cy="320.0" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
<text x="35.0" y="324.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">2</text>
<text x="56.0" y="325.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">BFS carrying each node's parent: from 2, visit 3 and 4. Then 3 examines 4: already</text>
<text x="56.0" y="344.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">visited AND not 3's parent → a second route exists → cycle.</text>
<line x1="411.6" y1="410.0" x2="411.6" y2="476.0" stroke="#16a34a" stroke-width="1.6"/>
<line x1="431.0" y1="394.7" x2="611.4" y2="438.8" stroke="#16a34a" stroke-width="1.6"/>
