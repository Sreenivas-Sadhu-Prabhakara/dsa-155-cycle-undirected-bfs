<text x="56.0" y="571.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">True. Every component gets its own BFS (the 0-1 piece is cycle-free). 'Visited</text>
<text x="56.0" y="590.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">non-parent neighbor' is the complete cycle test for undirected graphs — no colors</text>
<text x="56.0" y="609.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">needed.</text>
<text x="72.0" y="644.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">verdicts</text>
